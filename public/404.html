<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>PDFácil — Comprime y edita PDF gratis, en tu navegador</title>
    <script type="text/javascript">
      // SPA fallback para GitHub Pages (spa-github-pages):
      // GitHub Pages sirve este archivo ante rutas desconocidas; codificamos
      // la ruta original en el querystring y recargamos index.html, que se
      // encarga de restaurarla con history.replaceState.
      var pathSegmentsToKeep = 1 // '/Compresor-PDF'
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
